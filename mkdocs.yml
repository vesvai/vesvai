site_name: Vesvai Documentation
site_url: https://docs.vesv.ai.org/
site_description: Vesvai - Coding Agent Documentation

repo_name: vesvai/vesvai
repo_url: https://github.com/vesvai/vesvai
edit_uri: https://github.com/vesvai/docs/edit/master/docs/

copyright: "&copy; 2026 Vesvai"

theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: lucide/moon-star
        name: Switch to system preference
  icon:
    tag:
      default: lucide/hash

plugins:
  - search
  - tags
  - markdown-exec
  - redirects:
      redirect_maps:
        setup/extensions/about.md: compatibility/markdown/index.md
        setup/extensions/glightbox.md: compatibility/mkdocs/plugins.md#glightbox
        setup/extensions/macros.md: compatibility/mkdocs/plugins.md#macros
        setup/extensions/markdown-exec.md: compatibility/mkdocs/plugins.md#markdown-exec
        setup/extensions/mkdocstrings.md: compatibility/mkdocs/plugins.md#mkdocstrings
        setup/extensions/python-markdown.md: compatibility/markdown/python-markdown.md
        setup/extensions/python-markdown-extensions.md: compatibility/markdown/python-markdown-extensions.md
        setup/versioning.md: compatibility/mkdocs/mike.md
        setup/social-cards.md: compatibility/mkdocs/index.md

extra:
  homepage: https://vesv.ai
  scope: /
  annotate:
    json: [.s2]
  status:
    new: Recently added
    deprecated: Deprecated
    material: Material for MkDocs
  social:
  tags:
    default: default

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - zensical.extensions.glightbox:
      auto_themed: true
  - zensical.extensions.preview:
      targets:
        include:
          - customization.md
          - compatibility/markdown/*
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: zensical
      repo: zensical
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: https://vesv.ai
  - Get started:
      - Get started: index.md
  - Cli:
      - Cli: cli/index.md
  - Tui:
      - Tui: tui/index.md
  - Sdk:
      - Sdk: sdk/index.md